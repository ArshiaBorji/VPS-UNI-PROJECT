<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Project</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="container">
    <div class="topbar">
        <h1>Items</h1>
        <div class="user-box">
        <span id="who" class="who"></span>
        <button id="logout-btn" class="logout" type="button">Sign out</button>
        </div>
    </div>
    <p class="subtitle">Create, view and delete items.</p>

    <form id="item-form" class="card">
        <input id="name" type="text" placeholder="Name" required maxlength="80" />
        <textarea id="description" placeholder="Description" rows="3" maxlength="500"></textarea>
        <button type="submit" id="submit-btn">Add item</button>
    </form>

    <div id="status" class="status" hidden></div>

    <ul id="item-list" class="item-list"></ul>
    </main>

    <script src="auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
