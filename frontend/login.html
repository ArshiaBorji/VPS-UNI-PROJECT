<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — My Project</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main class="container container-narrow">
    <h1>My Project</h1>
    <p class="subtitle">Sign in or create an account.</p>

    <div class="tabs">
        <button class="tab active" data-mode="login"  type="button">Sign in</button>
        <button class="tab"        data-mode="signup" type="button">Sign up</button>
    </div>

    <form id="auth-form" class="card">
        <input id="username" type="text"     placeholder="Username"
                required minlength="3" maxlength="40" autocomplete="username" />
        <input id="password" type="password" placeholder="Password"
                required minlength="6" maxlength="128" autocomplete="current-password" />
        <button type="submit" id="auth-btn">Sign in</button>
    </form>

    <div id="status" class="status" hidden></div>
    </main>

    <script src="auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
